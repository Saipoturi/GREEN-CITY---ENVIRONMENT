
# Build and deploy Green City Flask application to Azure App Service

name: Build and deploy Python app to Azure Web App - webapp-sai

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and check application
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile app.py
          test -d templates
          test -d static

      - name: Upload application files
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !.git/
            !.venv/
            !venv/
          include-hidden-files: false

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download application files
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E73D5E717B98446ABC0420908CF0502D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3B8EA14E3D4942CC84030F8485F9D9A0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BAC33C145BD44196A5C7D0C6963DEA80 }}

      - name: Configure Python application
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config appsettings set \
              --resource-group rg-lab2-sai \
              --name webapp-sai \
              --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true

            az webapp config set \
              --resource-group rg-lab2-sai \
              --name webapp-sai \
              --startup-file "gunicorn --bind=0.0.0.0 --timeout 600 app:app"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: webapp-sai
          slot-name: Production
          package: .
