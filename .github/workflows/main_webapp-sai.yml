
# Build and deploy Green City Flask application to Azure App Service

name: Build and deploy Python app to Azure Web App - webapp-sai

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Flask application
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile app.py
          test -d templates
          test -d static

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E73D5E717B98446ABC0420908CF0502D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3B8EA14E3D4942CC84030F8485F9D9A0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BAC33C145BD44196A5C7D0C6963DEA80 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: webapp-sai
          slot-name: Production
          package: .
